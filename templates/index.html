<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gambar ke PDF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #333;
    }

    h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 6px; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 24px; }

    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      background: #e8e8e8;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 24px;
    }

    .mode-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #888;
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn.active {
      background: #fff;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .mode-hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Drop Zone */
    #drop-zone {
      width: 100%;
      max-width: 560px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      background: #fff;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    #drop-zone.dragover { border-color: #555; background: #f0f0f0; }
    #drop-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    #drop-zone p { color: #666; font-size: 0.95rem; }
    #drop-zone span { color: #333; font-weight: 600; text-decoration: underline; cursor: pointer; }

    #file-input { display: none; }

    /* Preview List */
    #preview-section {
      width: 100%;
      max-width: 560px;
      margin-top: 28px;
      display: none;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title { font-weight: 600; font-size: 0.95rem; color: #555; }

    .btn-clear {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn-clear:hover { background: #fdecea; }

    #preview-list { display: flex; flex-direction: column; gap: 8px; }

    .preview-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: grab;
      transition: box-shadow 0.15s;
      user-select: none;
    }

    .preview-item:active { cursor: grabbing; }
    .preview-item.dragging { opacity: 0.4; }
    .preview-item.drag-over { border-color: #555; box-shadow: 0 0 0 2px #55555530; }

    .preview-item img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .preview-item .file-info { flex: 1; overflow: hidden; }
    .preview-item .file-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-item .file-size { font-size: 0.78rem; color: #aaa; margin-top: 2px; }

    .preview-item .drag-handle { color: #ccc; font-size: 1.1rem; cursor: grab; flex-shrink: 0; }

    .btn-remove-item {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .btn-remove-item:hover { color: #e74c3c; background: #fdecea; }

    /* Convert Button */
    #convert-btn {
      margin-top: 20px;
      width: 100%;
      max-width: 560px;
      padding: 14px;
      background: #333;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      display: none;
    }

    #convert-btn:hover { background: #111; }
    #convert-btn:disabled { background: #aaa; cursor: not-allowed; }

    #status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #888;
      min-height: 22px;
      text-align: center;
    }

    #status.success { color: #27ae60; font-weight: 500; }
    #status.error { color: #e74c3c; font-weight: 500; }

    .hint { margin-top: 32px; font-size: 0.8rem; color: #bbb; text-align: center; }
  </style>
</head>
<body>

  <h1>🖼️ Gambar ke PDF</h1>
  <p class="subtitle">PNG & JPG → PDF dalam satu klik</p>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-gabung" onclick="setMode('gabung')">📄 Gabung jadi 1 PDF</button>
    <button class="mode-btn" id="btn-pisah" onclick="setMode('pisah')">🗂️ Pisah (1 gambar = 1 PDF)</button>
  </div>
  <p class="mode-hint" id="mode-hint">Semua gambar digabung jadi satu file PDF</p>

  <div id="drop-zone">
    <div class="icon">📂</div>
    <p>Seret gambar ke sini, atau <span onclick="document.getElementById('file-input').click()">pilih file</span></p>
    <p style="margin-top:6px;font-size:0.82rem;color:#bbb;">PNG, JPG — bisa banyak sekaligus</p>
  </div>
  <input type="file" id="file-input" multiple accept=".png,.jpg,.jpeg" />

  <div id="preview-section">
    <div class="section-header">
      <span class="section-title" id="section-title-text">Urutan Halaman <span id="count" style="color:#aaa;font-weight:400;"></span></span>
      <button class="btn-clear" onclick="clearAll()">Hapus semua</button>
    </div>
    <div id="preview-list"></div>
  </div>

  <button id="convert-btn" onclick="convertToPDF()">Convert ke PDF</button>
  <div id="status"></div>

  <p class="hint" id="hint-text">Drag item untuk mengatur urutan halaman PDF</p>

<script>
  let files = [];
  let idCounter = 0;
  let dragSrcId = null;
  let mode = 'gabung';

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const previewSection = document.getElementById('preview-section');
  const previewList = document.getElementById('preview-list');
  const convertBtn = document.getElementById('convert-btn');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');

  function setMode(m) {
    mode = m;
    document.getElementById('btn-gabung').classList.toggle('active', m === 'gabung');
    document.getElementById('btn-pisah').classList.toggle('active', m === 'pisah');

    if (m === 'gabung') {
      document.getElementById('mode-hint').textContent = 'Semua gambar digabung jadi satu file PDF';
      document.getElementById('section-title-text').innerHTML = 'Urutan Halaman <span id="count" style="color:#aaa;font-weight:400;"></span>';
      document.getElementById('hint-text').textContent = 'Drag item untuk mengatur urutan halaman PDF';
      convertBtn.textContent = 'Convert ke PDF';
    } else {
      document.getElementById('mode-hint').textContent = 'Tiap gambar jadi PDF sendiri — didownload sebagai file ZIP';
      document.getElementById('section-title-text').innerHTML = 'Gambar <span id="count" style="color:#aaa;font-weight:400;"></span>';
      document.getElementById('hint-text').textContent = 'Tiap gambar akan jadi file PDF terpisah dalam satu ZIP';
      convertBtn.textContent = 'Convert & Download ZIP';
    }

    updateCount();
  }

  function updateCount() {
    const el = document.getElementById('count');
    if (el) el.textContent = files.length > 0 ? `(${files.length} gambar)` : '';
  }

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  function addFiles(newFiles) {
    const valid = newFiles.filter(f => /\.(png|jpg|jpeg)$/i.test(f.name));
    if (valid.length === 0) { setStatus('Format tidak didukung. Hanya PNG dan JPG.', 'error'); return; }
    valid.forEach(f => {
      files.push({ id: ++idCounter, file: f, objectUrl: URL.createObjectURL(f) });
    });
    render();
    setStatus('', '');
  }

  function render() {
    previewList.innerHTML = '';
    files.forEach(item => {
      const div = document.createElement('div');
      div.className = 'preview-item';
      div.dataset.id = item.id;
      div.draggable = true;
      div.innerHTML = `
        <span class="drag-handle">⠿</span>
        <img src="${item.objectUrl}" alt="${item.file.name}" />
        <div class="file-info">
          <div class="file-name">${item.file.name}</div>
          <div class="file-size">${(item.file.size / 1024).toFixed(1)} KB</div>
        </div>
        <button class="btn-remove-item" title="Hapus" onclick="removeItem(${item.id})">✕</button>
      `;
      div.addEventListener('dragstart', () => { dragSrcId = item.id; div.classList.add('dragging'); });
      div.addEventListener('dragend', () => div.classList.remove('dragging'));
      div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
      div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
      div.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation();
        div.classList.remove('drag-over');
        if (dragSrcId === item.id) return;
        const srcIdx = files.findIndex(f => f.id === dragSrcId);
        const dstIdx = files.findIndex(f => f.id === item.id);
        const [moved] = files.splice(srcIdx, 1);
        files.splice(dstIdx, 0, moved);
        render();
      });
      previewList.appendChild(div);
    });

    const hasFiles = files.length > 0;
    previewSection.style.display = hasFiles ? 'block' : 'none';
    convertBtn.style.display = hasFiles ? 'block' : 'none';
    updateCount();
  }

  function removeItem(id) {
    const idx = files.findIndex(f => f.id === id);
    if (idx !== -1) { URL.revokeObjectURL(files[idx].objectUrl); files.splice(idx, 1); }
    render();
  }

  function clearAll() {
    files.forEach(f => URL.revokeObjectURL(f.objectUrl));
    files = [];
    render();
    setStatus('', '');
  }

  async function convertToPDF() {
    if (files.length === 0) return;
    convertBtn.disabled = true;
    convertBtn.textContent = 'Mengonversi...';
    setStatus('Sedang memproses...', '');

    const formData = new FormData();
    files.forEach(item => formData.append('images', item.file));

    const endpoint = mode === 'gabung' ? '/convert' : '/convert_split';
    const downloadName = mode === 'gabung' ? 'hasil.pdf' : 'hasil_pdf.zip';

    try {
      const res = await fetch(endpoint, { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Terjadi kesalahan');
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = downloadName;
      a.click();
      URL.revokeObjectURL(url);
      const msg = mode === 'gabung' ? '✅ PDF berhasil dibuat!' : `✅ ZIP berhasil dibuat! (${files.length} file PDF)`;
      setStatus(msg, 'success');
    } catch (err) {
      setStatus('❌ ' + err.message, 'error');
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = mode === 'gabung' ? 'Convert ke PDF' : 'Convert & Download ZIP';
    }
  }

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type;
  }
</script>
</body>
</html>
